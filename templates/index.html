<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NicoChat – Local AI Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #1f2937;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #f8fafc;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      border-bottom: 1px solid #d1d5db;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #111827;
      flex: 1;
    }

    #model-select {
      background: #ffffff;
      color: #111827;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.9rem;
      cursor: pointer;
      max-width: 260px;
    }

    #model-select:focus { outline: none; border-color: #2563eb; }

    .model-picker {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-start;
    }

    .model-help {
      color: #6b7280;
      font-size: 0.8rem;
      max-width: 320px;
    }

    #no-models-warning {
      display: none;
      background: #fffbeb;
      color: #92400e;
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #fbbf24;
    }

    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 100%;
      width: 100%;
    }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.assistant { align-self: flex-start; }

    .avatar { display: none; }

    .message.user .avatar { background: #e5e7eb; }
    .message.assistant .avatar { background: #ffffff; }

    .bubble {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 100%;
    }

    .message.user .bubble { background: #f8fbff; border-color: #cbd5e1; border-radius: 8px; }
    .message.assistant .bubble { border-radius: 8px; }

    .bubble.typing::after {
      content: '▌';
      animation: blink 0.8s step-end infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    footer {
      background: #f8fafc;
      border-top: 1px solid #d1d5db;
      padding: 16px 20px;
      flex-shrink: 0;
    }

    #input-row {
      display: flex;
      gap: 10px;
      max-width: 760px;
      margin: 0 auto;
    }

    #user-input {
      flex: 1;
      background: #ffffff;
      color: #111827;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 1rem;
      resize: none;
      min-height: 48px;
      max-height: 200px;
      line-height: 1.5;
    }

    #user-input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.18); }
    #user-input::placeholder { color: #888; }

    #send-btn {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 1rem;
      cursor: pointer;
      align-self: flex-end;
      height: 48px;
      transition: background 0.2s;
    }

    #send-btn:hover { background: #1d4ed8; }
    #send-btn:disabled { background: #9ca3af; cursor: not-allowed; }

    #clear-btn {
      background: transparent;
      color: #4b5563;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      align-self: flex-end;
      height: 48px;
      transition: all 0.2s;
    }

    #clear-btn:hover { color: #111827; border-color: #9ca3af; background: #f9fafb; }

    #status-bar {
      text-align: center;
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 8px;
    }

    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #6b7280;
      pointer-events: none;
    }

    #empty-state p { font-size: 1rem; }
  </style>
</head>
<body>

<header>
  <h1>NicoChat</h1>
  <div class="model-picker">
    <select id="model-select" title="Select model">
      {% if models %}
        {% for model in models %}
          <option value="{{ model }}">{{ model }}</option>
        {% endfor %}
      {% else %}
        <option value="" disabled selected>No models found</option>
      {% endif %}
    </select>
    <span class="model-help">Choose a model from the Ollama list above. If none appear, pull one and refresh.</span>
  </div>
  <span id="no-models-warning">Start Ollama and pull a model to begin.</span>
</header>

<div id="chat-window">
  <div id="empty-state">
    <p>Select a model and send a message to begin.</p>
  </div>
</div>

<footer>
  <div id="input-row">
    <textarea id="user-input" placeholder="Type a message… (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
    <button id="clear-btn" title="Clear chat">Clear</button>
    <button id="send-btn" title="Send message">Send</button>
  </div>
  <div id="status-bar"></div>
</footer>

<script>
  const chatWindow = document.getElementById('chat-window');
  const emptyState = document.getElementById('empty-state');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const clearBtn = document.getElementById('clear-btn');
  const modelSelect = document.getElementById('model-select');
  const noModelsWarning = document.getElementById('no-models-warning');
  const statusBar = document.getElementById('status-bar');

  // Conversation history for multi-turn context
  let history = [];
  let isStreaming = false;

  // Show warning when no models are available
  if (!modelSelect.value) {
    noModelsWarning.style.display = 'block';
    sendBtn.disabled = true;
  }

  // Auto-grow textarea
  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 200) + 'px';
  });

  // Send on Enter (Shift+Enter = newline)
  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);
  clearBtn.addEventListener('click', clearChat);

  function appendMessage(role, content, streaming = false) {
    if (emptyState.parentNode) emptyState.remove();

    const wrapper = document.createElement('div');
    wrapper.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? 'You' : 'AI';

    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (streaming ? ' typing' : '');
    bubble.textContent = content;

    wrapper.appendChild(avatar);
    wrapper.appendChild(bubble);
    chatWindow.appendChild(wrapper);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return bubble;
  }

  function setStatus(msg) {
    statusBar.textContent = msg;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || isStreaming) return;

    const model = modelSelect.value;
    if (!model) {
      setStatus('Please select a model first.');
      return;
    }

    // Add user message
    appendMessage('user', text);
    history.push({ role: 'user', content: text });

    userInput.value = '';
    userInput.style.height = 'auto';
    sendBtn.disabled = true;
    isStreaming = true;
    setStatus('Generating…');

    const bubble = appendMessage('assistant', '', true);
    let fullContent = '';

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model, messages: history }),
      });

      if (!response.ok) {
        const err = await response.json();
        bubble.classList.remove('typing');
        bubble.textContent = '\u26A0 Error: ' + (err.error || response.statusText);
        setStatus('');
        return;
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep incomplete line

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6).trim();
          if (payload === '[DONE]') break;
          try {
            const parsed = JSON.parse(payload);
            if (parsed.error) {
              bubble.textContent = '\u26A0 ' + parsed.error;
              bubble.classList.remove('typing');
            } else if (parsed.content) {
              fullContent += parsed.content;
              bubble.textContent = fullContent;
              chatWindow.scrollTop = chatWindow.scrollHeight;
            }
          } catch (parseErr) {
            console.error('Failed to parse SSE payload:', payload, parseErr);
          }
        }
      }
    } catch (err) {
      bubble.textContent = '\u26A0 Network error: ' + err.message;
    } finally {
      bubble.classList.remove('typing');
      if (fullContent) {
        history.push({ role: 'assistant', content: fullContent });
      }
      sendBtn.disabled = false;
      isStreaming = false;
      setStatus('');
    }
  }

  function clearChat() {
    history = [];
    chatWindow.innerHTML = '';
    chatWindow.appendChild(emptyState);
    setStatus('Chat cleared.');
    setTimeout(() => setStatus(''), 2000);
  }
</script>

</body>
</html>
