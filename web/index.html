<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NicoChat</title>
    <meta name="theme-color" content="#111827" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Local AI chat</p>
          <h1>NicoChat</h1>
          <p class="subtitle">
            A local-network chat UI backed by the Rust server.
          </p>
        </div>
        <div class="status-card">
          <p><strong>Backend:</strong> <span id="backendValue">Loading…</span></p>
          <p><strong>Mode:</strong> <span id="modeValue">Loading…</span></p>
          <p><strong>Model:</strong> <span id="modelValue">Loading…</span></p>
        </div>
      </section>

      <section class="chat-card">
        <div class="model-selector">
          <label for="modelSelect">Model:</label>
          <select id="modelSelect" title="Select model">
            <option value="" disabled selected>Loading models…</option>
          </select>
          <div class="history-control">
            <label for="historyLengthInput">History:</label>
            <input
              id="historyLengthInput"
              type="number"
              min="0"
              max="100"
              step="1"
              value="12"
              title="Number of recent messages sent to the model"
            />
          </div>
          <div class="speed-control">
            <label for="speedModeSelect">Speed mode:</label>
            <select id="speedModeSelect" title="Speed mode">
              <option value="fast">Fast</option>
              <option value="balanced" selected>Balanced</option>
              <option value="quality">Quality</option>
            </select>
          </div>
          <div class="accelerator-control">
            <label for="acceleratorSelect">Accelerator:</label>
            <select id="acceleratorSelect" title="Accelerator">
              <option value="cpu" selected>CPU</option>
              <option value="gpu">GPU</option>
              <option value="npu">NPU</option>
              <option value="remote">Remote (Internet)</option>
            </select>
            <input
              id="remoteEndpointInput"
              type="text"
              placeholder="https://cloud.ollama.ai"
              style="display:none; margin-left:0.5rem; width:220px;"
              title="Remote Ollama endpoint (used if Remote is selected)"
            />
            </div>
            <div class="internet-access-control" style="margin-top:0.7rem;">
              <label for="internetAccessToggle">Allow Internet Access:</label>
              <button id="internetAccessToggle" class="toggle-btn active" type="button">Enabled</button>
            </div>
          </div>
        </div>
        <p class="hint">
          Choose a model from Ollama and set how many recent messages are included per request. 0 means only your latest message.
        </p>

        <div id="messages" class="messages" aria-live="polite">
        </div>

        <form id="chatForm" class="composer">
          <label class="sr-only" for="messageInput">Message</label>
          <textarea
            id="messageInput"
            name="message"
            rows="3"
            placeholder="Ask something…"
            required
          ></textarea>
          <div class="composer-actions">
            <p class="hint">
              Android client available in the <code>android/</code> folder.
            </p>
            <button id="sendButton" type="submit">Send</button>
          </div>
        </form>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
